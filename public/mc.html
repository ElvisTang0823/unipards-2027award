<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111410">
  <title>司儀流程 | NKS Award</title>
  <link rel="stylesheet" href="/css/mc.css">
</head>
<body>
  <header>
    <div class="eyebrow">NKS Award · Stage Companion</div>
    <h1>司儀流程</h1>
  </header>
  <main>
    <section id="pgm" aria-live="polite">
      <div class="status" id="liveBadge">PGM 待命</div>
      <h2 id="liveTitle">目前沒有字卡</h2>
      <p id="liveDetail">等待導播發送</p>
    </section>
    <section aria-labelledby="guestHeading">
      <div class="section-heading"><h2 id="guestHeading">致詞嘉賓</h2><span>依清單順序</span></div>
      <div class="flow-list" id="guestList"></div>
    </section>
    <section aria-labelledby="awardHeading">
      <div class="section-heading"><h2 id="awardHeading">頒獎流程</h2><span>得獎名單與個人備註</span></div>
      <div class="flow-list" id="awardList"></div>
    </section>
    <p id="empty" hidden>目前尚無流程資料。</p>
  </main>
  <script src="/js/mc.js" defer></script>
</body>
</html>
