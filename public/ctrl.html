<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>FRC Lower Third 控制台</title>
  <link rel="stylesheet" href="/css/ctrl.css">
</head>
<body>

  <div class="global-actions">
    <button class="btn-hide global-action-button" data-action="emergency-clear">🚨 緊急清空畫面</button>
    <button id="tickerToggle" class="btn-show global-action-button" data-action="toggle-ticker">顯示跑馬燈</button>
    <button id="watermarkToggle" class="btn-hide global-action-button" data-action="toggle-watermark">隱藏浮水印</button>
    <button class="btn-backup" type="button" data-action="save-now">儲存資料</button>
    <button class="btn-backup" type="button" data-action="save-backup">儲存備份</button>
    <span id="saveStatus" role="status" aria-live="polite"></span>
  </div>

  <h1>FRC Lower Third 控制台</h1>

  <!-- 1. 致詞嘉賓清單 -->
  <div class="section">
    <h2>致詞嘉賓列表</h2>
    <table id="guestTable">
      <thead>
        <tr>
          <th>單位 / 組織</th>
          <th>姓名</th>
          <th>職位 (可留空)</th>
          <th class="actions-heading">即時控制</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button class="btn-add" data-action="add-guest">+ 新增嘉賓</button>
  </div>

  <!-- 2. 頒獎與隊伍清單 -->
  <div class="section">
    <h2>頒獎與得獎名單</h2>
    <table id="awardTable">
      <thead>
        <tr>
          <th>獎項名稱</th>
          <th>得獎隊號</th>
          <th>隊伍名稱 (要寫·)</th>
          <th class="actions-heading">即時控制</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button class="btn-add" data-action="add-award">+ 新增獎項</button>
  </div>

  <div class="section">
    <h2>儀式名稱</h2>
    <table id="ceremonyTable">
      <thead>
        <tr>
          <th>大標題</th>
          <th>小標題</th>
          <th class="actions-heading">即時控制</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button class="btn-add" data-action="add-ceremony">+ 新增儀式名稱</button>
  </div>

  <div class="section">
    <h2>跑馬燈</h2>
    <div id="tickerLines"></div>
    <button class="btn-add" data-action="add-ticker-line">+ 新增文字行</button>
  </div>

  <script src="/js/ctrl.js" defer></script>
</body>
</html>
